# TEMPORARY (AI #2, 26 Oct) — remove before the PR is merged.
#
# `visual-baselines.yml` needs a manual dispatch, which this session's GitHub token cannot create
# (HTTP 403), and this sandbox has no Chromium. The report/list/help batch deliberately changes the
# desktop and phone Settings, Sales, Purchases, P&L and Balance Sheet screens, so every changed
# reference image must be recaptured on the Linux Chromium CI uses. This workflow mirrors the manual one — capture,
# then check the whole reference set — and commits candidates to the branch as reviewable PNG diffs.
# It pushes nothing to main and makes no change once the images match.
name: AI2 refresh visual baselines (temporary)
on:
  push:
    branches:
      - arena/63bdffa0-ledgerflow
permissions:
  contents: write
jobs:
  capture:
    if: "!contains(github.event.head_commit.message, 'AI2 recaptured')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - name: Recapture every changed reference image
        run: npx playwright test e2e/visual-regression.spec.ts --update-snapshots --retries=0
      - name: Check the entire reference set
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ai2-visual-check.json
        run: |
          set +e
          npx playwright test e2e/visual-regression.spec.ts --reporter=list,json --retries=0
          browser_exit=$?
          node scripts/playwright-ci-feedback.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME"
          exit "$browser_exit"
      - name: Commit the candidates to this branch
        run: |
          git add e2e/__screenshots__
          if git diff --cached --quiet; then echo "No image changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: AI2 recaptured changed desktop reference images [skip ci]"
          git push
