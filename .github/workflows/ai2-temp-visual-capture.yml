# TEMPORARY — AI #2 (27 Oct). Removed again in the very next commit before the PR is handed over.
# Recaptures the pnl/balance-sheet reference images with the Linux Chromium the CI gate uses, because
# the reviewed P&L colour fix changes 138 light-mode pixels and the manual dispatch is 403 for this token.
name: AI2 temp visual capture
permissions:
  contents: write
on:
  push:
    branches: [arena/89c30823-ledgerflow]
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[ai2-temp]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - name: Capture the statement cards at both widths and themes
        run: npx playwright test e2e/visual-regression.spec.ts --grep "pnl|balance-sheet" --update-snapshots --retries=0
      - name: Check the entire reference set against the new images
        run: npx playwright test e2e/visual-regression.spec.ts --retries=0
      - name: Commit only the reviewable images back to this branch
        run: |
          git add e2e/__screenshots__
          if git diff --cached --quiet; then echo "No image changed"; exit 0; fi
          git config user.name "AI #2 (Codex)"
          git config user.email "ai2@ledgerflow.local"
          git commit -m "test: reviewed visual references after the P&L link-colour fix"
          git push origin HEAD:arena/89c30823-ledgerflow
