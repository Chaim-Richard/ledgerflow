# TEMPORARY — AI #2 (27 Oct). Removed again before the PR is handed to the lead.
# Two jobs only, on pushes to the AI #2 arena branch whose message carries the marker `[ai2-temp]`:
#  - capture: recapture the pnl/balance-sheet reference images with the same Linux Chromium CI uses
#    (the manual "Refresh visual baselines" dispatch is 403 for this token) and commit only
#    e2e/__screenshots__ back to this branch;
#  - diagnose: run the two unit shards that failed on CI with the database the unit jobs get, and
#    turn every failing test name into a check-run annotation (the unit job's log is not reachable
#    from this sandbox).
name: AI2 temp visual + diagnosis
permissions:
  contents: write
on:
  push:
    branches: [arena/89c30823-ledgerflow]
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[ai2-temp]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - name: Capture the two statements at both widths and themes
        run: npx playwright test e2e/visual-regression.spec.ts --grep "pnl|balance-sheet" --update-snapshots --retries=0
      - name: Check the entire reference set
        run: npx playwright test e2e/visual-regression.spec.ts --retries=0
      - name: Commit only the reviewable images back to this branch
        run: |
          git add e2e/__screenshots__
          if git diff --cached --quiet; then echo "No image changed"; exit 0; fi
          git config user.name "AI #2 (Codex)"
          git config user.email "ai2@ledgerflow.local"
          git commit -m "test: reviewed visual references for the statement totals (pnl, balance sheet)"
          git push origin HEAD:arena/89c30823-ledgerflow
  diagnose:
    if: contains(github.event.head_commit.message, '[ai2-temp]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: development
          HUSKY: 0
      - name: Prepare the test database
        run: npm run db:test-setup
      - name: Shard 4/4 (the CI failure) with test names as annotations
        run: |
          set +e
          TEST_SHARD=4/4 npm run test:shard > shard4.log 2>&1
          grep -E "^not ok" shard4.log | sed -E 's/^not ok [0-9]+ - /::error title=shard4::/' | head -40
          tail -40 shard4.log
      - name: Shard 2/3 in Los Angeles (the CI failure) with test names as annotations
        run: |
          set +e
          TZ=America/Los_Angeles TEST_SHARD=2/3 npm run test:shard > shard2.log 2>&1
          grep -E "^not ok" shard2.log | sed -E 's/^not ok [0-9]+ - /::error title=shard2LA::/' | head -40
          tail -40 shard2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnosis-logs
          path: |
            shard4.log
            shard2.log
          retention-days: 3
          if-no-files-found: ignore
