name: AI 4 visual baseline bootstrap
on:
  push:
    branches: ['ai4/d-10-visual-regression']
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual-regression.spec.ts --update-snapshots --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai4-reviewed-visual-baselines
          path: |
            e2e/__screenshots__/
            test-results/
          retention-days: 7
