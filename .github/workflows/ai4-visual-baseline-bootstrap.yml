name: AI 4 visual baseline bootstrap
permissions:
  contents: write
on:
  push:
    branches: ['ai4/d-10-visual-regression']
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - name: Refuse to replace an existing reviewed baseline
        run: test -z "$(git ls-files e2e/__screenshots__)"
      - run: npx playwright test e2e/visual-regression.spec.ts --update-snapshots --retries=0
      - name: Publish initial images only to the AI 4 task branch
        run: |
          test "${{ github.ref }}" = "refs/heads/ai4/d-10-visual-regression"
          test "$(find e2e/__screenshots__ -name '*.png' | wc -l)" -eq 40
          git config user.name 'AI #4 (GitHub Actions)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/__screenshots__
          git commit -m 'test: AI #4 initial Linux Chromium visual baselines'
          git push origin HEAD:refs/heads/ai4/d-10-visual-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai4-reviewed-visual-baselines
          path: |
            e2e/__screenshots__/
            test-results/
          retention-days: 7
