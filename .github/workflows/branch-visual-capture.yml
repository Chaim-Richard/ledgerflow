name: Branch visual capture (temporary, AI #3)
# TEMPORARY: captures the pnl/balance-sheet baselines on this PR branch (the two new report tabs
# from A-54/A-56 change the always-visible report menu), verifies the full visual set passes with
# them, refuses to touch any other screen's baseline, and pushes the images to THIS branch — never
# to main. Removed again after the reviewed capture, like the Codex precedent. Same Linux Chromium
# and recipe as the main-only "Refresh visual baselines" workflow.
permissions:
  contents: write
on:
  push:
    branches: [arena/65507daa-ledgerflow]
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - name: Capture the two report screens with the new tabs
        run: npx playwright test e2e/visual-regression.spec.ts --grep "pnl|balance-sheet" --update-snapshots --retries=0
      - name: Refuse any change outside the two intended screens
        run: |
          git status --porcelain -- e2e/__screenshots__ > /tmp/changed.txt || true
          cat /tmp/changed.txt
          if grep -qvE '__screenshots__/(pnl|balance-sheet)-' /tmp/changed.txt; then
            echo "::error title=unexpected baseline changes::Only pnl/balance-sheet baselines may change; aborting without a commit."
            exit 1
          fi
      - name: Verify the whole visual set passes with the new baselines
        run: npx playwright test e2e/visual-regression.spec.ts --retries=0
      - name: Commit and push to this branch
        run: |
          git config user.name 'AI #3 visual capture (GitHub Actions)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/__screenshots__
          git diff --cached --quiet || { git commit -m "test: capture pnl|balance-sheet baselines with the two new report tabs (A-54, A-56)"; git pull --rebase origin "$GITHUB_REF_NAME"; git push origin "HEAD:$GITHUB_REF_NAME"; }
