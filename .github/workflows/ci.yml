name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify lockfile is in sync
        run: npm ci --dry-run
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Type check
        run: npm run lint:types

      - name: ESLint
        run: npm run lint:eslint
        continue-on-error: true

      - name: Run Accounting & Security Test Suites
        run: npm test

      - name: Unit tests in two other time zones
        run: |
          TZ=Pacific/Auckland npm test
          TZ=America/Los_Angeles npm test

      - name: Security audit
        run: npm audit --audit-level=high
      - name: Setup Java (for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Firestore Security Rules Tests (Emulator)
        run: npm run test:rules

  e2e:
    name: Playwright E2E Smoke Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Java (for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Playwright E2E Tests with Firebase Emulator
        run: npm run test:e2e

