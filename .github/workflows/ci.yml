name: CI

# Owner, 5 Oct 2026: Actions minutes are limited (2,000 a month; each run of this file costs about
# 28). Claude and Codex run every check locally before they push (docs/AGENTS.md), so pushes and
# pull requests no longer start CI. It runs once a week as a safety net, and by hand any time:
# GitHub → Actions → CI → "Run workflow".
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC

# a second run of the same branch stops the one still going (no double billing)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A plain Postgres with the Supabase migrations applied: the database security rules
    # tests and the server data-layer tests run against it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify lockfile is in sync
        run: npm ci --dry-run
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Type check
        run: npm run lint:types

      - name: ESLint (errors fail; warnings may not exceed --max-warnings in package.json)
        run: npm run lint:eslint

      - name: Prepare the test database (Supabase migrations)
        run: npm run db:test-setup

      - name: Database security rules tests
        run: npm run test:rules

      - name: Run Accounting & Security Test Suites (with the coverage gate; it only goes up)
        run: npm run test:cov

      - name: Security audit
        run: npm audit --audit-level=high

  # The whole unit suite again in a time zone ahead of and one behind UTC, in parallel with the
  # job above (run one after the other they took the job past its time limit).
  timezones:
    name: Unit tests in ${{ matrix.tz }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [Pacific/Auckland, America/Los_Angeles]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Prepare the test database (Supabase migrations)
        run: npm run db:test-setup

      - name: Unit tests
        run: npm test
        env:
          TZ: ${{ matrix.tz }}

  e2e:
    name: Playwright E2E Smoke Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
      # The dev server started by Playwright talks to the same test database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          npm_config_production: false
          HUSKY: 0

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare the test database (Supabase migrations)
        run: npm run db:test-setup

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
