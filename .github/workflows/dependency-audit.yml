name: Dependency Audit

# S-25: Dependency audit in CI: fail on high/critical with an allowlist file
#
# Runs npm audit and fails the build if high/critical vulnerabilities are found.
# Uses an allowlist file to ignore known false positives or accepted risks.
#
# Runs on:
# - Every push to main
# - Every pull request
# - Manually via workflow_dispatch

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only run one at a time per branch/PR
concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development
          HUSKY: 0

      - name: Run npm audit
        id: audit
        run: |
          # Run npm audit with JSON output
          npm audit --audit-level=high --json > audit-results.json 2>&1 || true
          
          # Parse and analyze results
          node - << 'EOF'
          const fs = require('fs');
          
          try {
            const audit = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            const vulnerabilities = audit.vulnerabilities || {};
            const totalVulns = Object.keys(vulnerabilities).length;
            
            let highCount = 0;
            let criticalCount = 0;
            let mediumCount = 0;
            let lowCount = 0;
            
            const findings = [];
            
            for (const [pkg, details] of Object.entries(vulnerabilities)) {
              const severity = details.severity;
              
              if (severity === 'critical') criticalCount++;
              else if (severity === 'high') highCount++;
              else if (severity === 'medium') mediumCount++;
              else if (severity === 'low') lowCount++;
              
              findings.push({
                package: pkg,
                version: details.range,
                severity,
                fixAvailable: details.fixAvailable || false,
                description: details.nodes?.join(', ') || 'N/A',
                via: details.via || []
              });
            }
            
            // Write findings to file
            fs.writeFileSync('audit-findings.json', JSON.stringify({ findings, totalVulns, highCount, criticalCount, mediumCount, lowCount }, null, 2));
            
            // Write summary
            let summary = '# Dependency Audit Report\n\n';
            summary += `**Timestamp:** ${new Date().toISOString()}\n\n`;
            summary += `**Commit:** ${{ github.sha }}\n\n`;
            summary += `## Summary\n\n`;
            summary += `| Severity | Count |\n`;
            summary += `|----------|-------|\n`;
            summary += `| Critical | ${criticalCount} |\n`;
            summary += `| High | ${highCount} |\n`;
            summary += `| Medium | ${mediumCount} |\n`;
            summary += `| Low | ${lowCount} |\n`;
            summary += `| **Total** | **${totalVulns}** |\n\n`;
            
            if (criticalCount > 0 || highCount > 0) {
              summary += '## ❌ High/Critical Vulnerabilities Found\n\n';
              summary += 'The following packages have high or critical vulnerabilities:\n\n';
              summary += '| Package | Version | Severity | Fix Available |\n';
              summary += '|---------|---------|----------|--------------|\n';
              
              for (const finding of findings.filter(f => f.severity === 'critical' || f.severity === 'high')) {
                summary += `| ${finding.package} | ${finding.version} | ${finding.severity} | ${finding.fixAvailable ? '✅ Yes' : '❌ No'} |\n`;
              }
            } else if (totalVulns > 0) {
              summary += '## ⚠️ Medium/Low Vulnerabilities Found\n\n';
              summary += 'Only medium and low severity vulnerabilities were found.\n\n';
            } else {
              summary += '## ✅ No Vulnerabilities Found\n\n';
              summary += 'All dependencies are free of known vulnerabilities.\n\n';
            }
            
            summary += '---\n\n';
            summary += '*This report was generated by the Dependency Audit workflow.*\n';
            
            fs.writeFileSync('audit-summary.md', summary);
            
            // Set outputs
            fs.writeFileSync('audit-outputs.json', JSON.stringify({
              hasCritical: criticalCount > 0,
              hasHigh: highCount > 0,
              hasVulnerabilities: totalVulns > 0,
              criticalCount,
              highCount,
              mediumCount,
              lowCount,
              totalVulns
            }));
            
            // Log summary
            console.log('Audit Summary:');
            console.log(`  Critical: ${criticalCount}`);
            console.log(`  High: ${highCount}`);
            console.log(`  Medium: ${mediumCount}`);
            console.log(`  Low: ${lowCount}`);
            
            // Exit with error if there are high/critical vulnerabilities
            if (criticalCount > 0 || highCount > 0) {
              process.exit(1);
            }
            
          } catch (err) {
            console.error('Failed to parse audit results:', err);
            process.exit(0); // Don't fail if we can't parse
          }
          EOF

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            audit-results.json
            audit-findings.json
            audit-summary.md
          retention-days: 30

      - name: Check allowlist
        id: allowlist
        run: |
          # Check if there's an allowlist file
          if [ -f .npm-audit-allowlist.json ]; then
            echo "Allowlist file found"
            
            # Read the allowlist
            ALLOWLIST=$(cat .npm-audit-allowlist.json)
            
            # Check if any vulnerabilities are in the allowlist
            node - << 'EOF'
            const fs = require('fs');
            
            try {
              const allowlist = JSON.parse(fs.readFileSync('.npm-audit-allowlist.json', 'utf8'));
              const findings = JSON.parse(fs.readFileSync('audit-findings.json', 'utf8'));
              
              const allowedVulns = allowlist.allow || [];
              
              // Filter out allowed vulnerabilities
              const filteredFindings = findings.findings.filter(finding => {
                const key = `${finding.package}:${finding.severity}`;
                return !allowedVulns.includes(key) && 
                       !allowedVulns.includes(finding.package) &&
                       !allowedVulns.includes(`*:${finding.severity}`);
              });
              
              // Update findings
              findings.findings = filteredFindings;
              findings.highCount = filteredFindings.filter(f => f.severity === 'high').length;
              findings.criticalCount = filteredFindings.filter(f => f.severity === 'critical').length;
              
              fs.writeFileSync('audit-findings-filtered.json', JSON.stringify(findings, null, 2));
              
              // Update outputs
              const outputs = JSON.parse(fs.readFileSync('audit-outputs.json', 'utf8'));
              outputs.hasCritical = findings.criticalCount > 0;
              outputs.hasHigh = findings.highCount > 0;
              outputs.hasVulnerabilities = filteredFindings.length > 0;
              outputs.criticalCount = findings.criticalCount;
              outputs.highCount = findings.highCount;
              
              fs.writeFileSync('audit-outputs.json', JSON.stringify(outputs));
              
              console.log(`Filtered ${findings.findings.length} findings (${findings.findings.length - filteredFindings.length} allowed)`);
              
            } catch (err) {
              console.error('Failed to process allowlist:', err);
            }
            EOF
          else
            echo "No allowlist file found"
          fi

      - name: Fail on high/critical vulnerabilities
        run: |
          if [ -f audit-outputs.json ]; then
            HAS_CRITICAL=$(jq '.hasCritical' audit-outputs.json)
            HAS_HIGH=$(jq '.hasHigh' audit-outputs.json)
            
            if [ "$HAS_CRITICAL" = "true" ] || [ "$HAS_HIGH" = "true" ]; then
              echo "::error::High or critical vulnerabilities detected!"
              echo "::error::Please update dependencies or review the allowlist."
              echo "::error::See the uploaded artifacts for details."
              exit 1
            fi
          fi

  allowlist-management:
    name: Allowlist Management
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.manage_allowlist == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate allowlist syntax
        run: |
          if [ -f .npm-audit-allowlist.json ]; then
            node - << 'EOF'
            const fs = require('fs');
            
            try {
              JSON.parse(fs.readFileSync('.npm-audit-allowlist.json', 'utf8'));
              console.log('✅ Allowlist syntax is valid');
            } catch (err) {
              console.error('❌ Invalid allowlist JSON:', err.message);
              process.exit(1);
            }
            EOF
          else
            echo "No allowlist file found"
          fi

      - name: Check for outdated allowlist entries
        run: |
          if [ -f .npm-audit-allowlist.json ]; then
            node - << 'EOF'
            const fs = require('fs');
            
            try {
              const allowlist = JSON.parse(fs.readFileSync('.npm-audit-allowlist.json', 'utf8'));
              const allowed = allowlist.allow || [];
              
              console.log(`Allowlist contains ${allowed.length} entries:`);
              for (const entry of allowed) {
                console.log(`  - ${entry}`);
              }
              
              // Check if any entries are outdated (older than 90 days)
              if (allowlist.lastUpdated) {
                const lastUpdated = new Date(allowlist.lastUpdated);
                const daysSinceUpdate = Math.floor((Date.now() - lastUpdated.getTime()) / (1000 * 60 * 60 * 24));
                
                if (daysSinceUpdate > 90) {
                  console.warn(`⚠️ Allowlist is ${daysSinceUpdate} days old. Consider reviewing it.`);
                }
              }
              
            } catch (err) {
              console.error('Failed to process allowlist:', err);
            }
            EOF
          fi

  generate-allowlist:
    name: Generate Allowlist Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.generate_allowlist == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate allowlist template
        run: |
          cat > .npm-audit-allowlist.json << 'EOF'
          {
            "$schema": "https://json.schemastore.org/npm-audit-allowlist.json",
            "lastUpdated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "description": "Allowlist for npm audit vulnerabilities accepted by the LedgerFlow team",
            "allow": [
              
            ],
            "notes": {
              "how-to-use": "Add vulnerability identifiers to the 'allow' array to suppress false positives",
              "format": "'package-name:severity' or 'package-name' or '*:severity'",
              "examples": [
                "some-package:high",
                "another-package",
                "*:low"
              ],
              "best-practices": [
                "Only allowlist vulnerabilities that are false positives or accepted risks",
                "Document the reason for each allowlist entry",
                "Review the allowlist regularly (at least quarterly)",
                "Prefer updating dependencies over allowlisting"
              ]
            }
          }
          EOF
          
          echo "✅ Generated allowlist template at .npm-audit-allowlist.json"
          git add .npm-audit-allowlist.json
          git diff --cached .npm-audit-allowlist.json

      - name: Create PR with allowlist template
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add npm audit allowlist template"
          title: "Add npm audit allowlist template"
          body: "Adds a template for the npm audit allowlist file.\n\nThis allows the team to document accepted vulnerabilities that are false positives or have been reviewed and deemed acceptable.\n\nSee S-25 for more details."
          branch: "setup/npm-audit-allowlist"
          delete-branch: true
