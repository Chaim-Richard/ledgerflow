name: Refresh report references for PR 133
# This short-lived branch-only workflow updates the eight screenshot references inspected in PR #133.
# It cannot write to main. Remove this workflow from the PR after the baselines are committed.
on:
  push:
    branches:
      - audit/ci-release-gates-20261014
    paths:
      - .github/workflows/refresh-pr133-report-baselines.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - run: npm run db:test-setup
      - name: Update only reviewed report screenshots
        run: npx playwright test e2e/visual-regression.spec.ts --grep 'visual (pnl|balance-sheet)' --update-snapshots --retries=0
      - name: Re-run all visual comparisons
        run: npx playwright test e2e/visual-regression.spec.ts --retries=0
      - name: Commit reviewed screenshot changes to this PR branch, not main
        run: |
          git config user.name 'Report baseline CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/__screenshots__/pnl-*.png e2e/__screenshots__/balance-sheet-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'test: refresh reviewed report screenshots for new report tabs'
            git push origin HEAD:audit/ci-release-gates-20261014
          fi
