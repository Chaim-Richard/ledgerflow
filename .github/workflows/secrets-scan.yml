name: Secrets Scan

# S-24: Secrets scan in CI (gitleaks) on every push
#
# Runs gitleaks to detect accidentally committed secrets, API keys, passwords, etc.
# Fails the build if secrets are found.
# Lists history findings for the owner.
#
# Runs on:
# - Every push to any branch
# - Every pull request
# - Manually via workflow_dispatch

on:
  push:
  pull_request:
  workflow_dispatch:

# Only run one at a time per branch/PR
concurrency:
  group: secrets-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Scan for secrets with gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to scan full git history

      - name: Setup gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run gitleaks scan
        id: scan
        run: |
          # Run gitleaks with verbose output
          gitleaks detect --source . --verbose --report-path gitleaks-report.json --report-format json 2>&1 || true
          
          # Also generate a SARIF report for GitHub Security tab
          gitleaks detect --source . --verbose --report-path gitleaks-report.sarif --report-format sarif 2>&1 || true
          
          # Generate a human-readable report
          gitleaks detect --source . --verbose --report-path gitleaks-report.txt 2>&1 || true
          
          # Check if any secrets were found
          if [ -f gitleaks-report.json ]; then
            FOUND_SECRET=$(jq '.Findings | length' gitleaks-report.json)
            if [ "$FOUND_SECRET" -gt 0 ]; then
              echo "found_secrets=true" >> $GITHUB_OUTPUT
              echo "secret_count=$FOUND_SECRET" >> $GITHUB_OUTPUT
            else
              echo "found_secrets=false" >> $GITHUB_OUTPUT
              echo "secret_count=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "found_secrets=false" >> $GITHUB_OUTPUT
            echo "secret_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload gitleaks reports
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports-${{ github.sha }}
          path: |
            gitleaks-report.json
            gitleaks-report.sarif
            gitleaks-report.txt
          retention-days: 30

      - name: Generate history report
        id: history
        run: |
          # Scan the full git history for previously committed secrets
          # This helps find secrets that were committed and later removed
          echo "Scanning full git history for secrets..."
          
          # Get the list of findings from the current scan
          if [ -f gitleaks-report.json ]; then
            # Extract all findings
            jq '.Findings' gitleaks-report.json > findings.json 2>/dev/null || echo "[]" > findings.json
            
            # Generate a summary report
            cat > secrets-scan-summary.md << 'EOF'
# Secrets Scan Summary

**Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")  
**Commit:** ${{ github.sha }}  
**Branch:** ${{ github.ref }}  
**Workflow:** ${{ github.workflow }}

## Current Scan Results

EOF
            
            # Add current findings
            CURRENT_COUNT=$(jq '.Findings | length' gitleaks-report.json 2>/dev/null || echo "0")
            echo "**Current secrets found:** $CURRENT_COUNT" >> secrets-scan-summary.md
            echo "" >> secrets-scan-summary.md
            
            if [ "$CURRENT_COUNT" -gt 0 ]; then
              echo "### Current Findings" >> secrets-scan-summary.md
              echo "" >> secrets-scan-summary.md
              echo "| File | Line | Secret Type | Description |" >> secrets-scan-summary.md
              echo "|------|------|-------------|-------------|" >> secrets-scan-summary.md
              
              for i in $(seq 0 $((CURRENT_COUNT - 1))); do
                FILE=$(jq -r ".Findings[$i].File" gitleaks-report.json 2>/dev/null || echo "N/A")
                LINE=$(jq -r ".Findings[$i].Line" gitleaks-report.json 2>/dev/null || echo "N/A")
                SECRET_TYPE=$(jq -r ".Findings[$i].Secret" gitleaks-report.json 2>/dev/null || echo "N/A")
                DESCRIPTION=$(jq -r ".Findings[$i].Description" gitleaks-report.json 2>/dev/null || echo "N/A")
                echo "| $FILE | $LINE | $SECRET_TYPE | $DESCRIPTION |" >> secrets-scan-summary.md
              done
              echo "" >> secrets-scan-summary.md
            fi
            
            echo "## History Findings" >> secrets-scan-summary.md
            echo "" >> secrets-scan-summary.md
            echo "To get full history findings, run:" >> secrets-scan-summary.md
            echo "```bash" >> secrets-scan-summary.md
            echo "gitleaks detect --source . --git-history --report-path history-report.json" >> secrets-scan-summary.md
            echo "```" >> secrets-scan-summary.md
            echo "" >> secrets-scan-summary.md
            
            # Note: Full history scan is expensive and should be done separately
            echo "**Note:** Full git history scan is not performed in this workflow due to time constraints." >> secrets-scan-summary.md
            echo "The owner should run a full history scan periodically and review the results." >> secrets-scan-summary.md
            echo "" >> secrets-scan-summary.md
            
            echo "## Recommendations" >> secrets-scan-summary.md
            echo "" >> secrets-scan-summary.md
            
            if [ "$CURRENT_COUNT" -gt 0 ]; then
              echo "❌ **ACTION REQUIRED:** $CURRENT_COUNT secrets found in current code." >> secrets-scan-summary.md
              echo "1. Review each finding above" >> secrets-scan-summary.md
              echo "2. Remove or rotate any committed secrets" >> secrets-scan-summary.md
              echo "3. Add secret patterns to .gitleaks.toml if false positives" >> secrets-scan-summary.md
              echo "4. Commit the changes and push again" >> secrets-scan-summary.md
            else
              echo "✅ **No secrets found in current code.**" >> secrets-scan-summary.md
              echo "1. Consider running a full history scan periodically" >> secrets-scan-summary.md
              echo "2. Review and update .gitleaks.toml as needed" >> secrets-scan-summary.md
              echo "3. Educate team members on secret management best practices" >> secrets-scan-summary.md
            fi
            
            echo "" >> secrets-scan-summary.md
            echo "---" >> secrets-scan-summary.md
            echo "*This report was generated by the Secrets Scan workflow.*" >> secrets-scan-summary.md
            
          else
            echo "No findings to report" > secrets-scan-summary.md
          fi

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-summary-${{ github.sha }}
          path: secrets-scan-summary.md
          retention-days: 30

      - name: Fail if secrets found
        if: steps.scan.outputs.found_secrets == 'true'
        run: |
          echo "::error::Secrets detected in the repository!"
          echo "::error::Found ${{ steps.scan.outputs.secret_count }} potential secrets."
          echo "::error::Please review the gitleaks report and remove/rotate any committed secrets."
          echo "::error::See the uploaded artifacts for details."
          exit 1

  history-scan:
    name: Full history secrets scan (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_history == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full history scan
        run: |
          echo "Running full git history scan..."
          echo "This may take a while for large repositories."
          
          # Run with git history
          gitleaks detect --source . --git-history --verbose --report-path full-history-report.json 2>&1 || true
          
          # Generate human-readable report
          gitleaks detect --source . --git-history --verbose --report-path full-history-report.txt 2>&1 || true
          
          # Count findings
          if [ -f full-history-report.json ]; then
            TOTAL_FINDINGS=$(jq '.Findings | length' full-history-report.json 2>/dev/null || echo "0")
            echo "Total historical findings: $TOTAL_FINDINGS"
            
            # Generate history summary
            cat > full-history-summary.md << 'EOF'
# Full Git History Secrets Scan

**Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")  
**Workflow:** ${{ github.workflow }}  

## Summary

Total historical findings: $TOTAL_FINDINGS

EOF
            
            if [ "$TOTAL_FINDINGS" -gt 0 ]; then
              echo "" >> full-history-summary.md
              echo "## Findings by Commit" >> full-history-summary.md
              echo "" >> full-history-summary.md
              
              # Group by commit
              COMMITS=$(jq -r '.Findings | group_by(.Commit) | length' full-history-report.json 2>/dev/null || echo "0")
              echo "Affected commits: $COMMITS" >> full-history-summary.md
              echo "" >> full-history-summary.md
              
              # List all findings
              echo "| Commit | File | Line | Secret Type | Description |" >> full-history-summary.md
              echo "|--------|------|------|-------------|-------------|" >> full-history-summary.md
              
              for i in $(seq 0 $((TOTAL_FINDINGS - 1))); do
                COMMIT=$(jq -r ".Findings[$i].Commit" full-history-report.json 2>/dev/null | head -c 8 || echo "N/A")
                FILE=$(jq -r ".Findings[$i].File" full-history-report.json 2>/dev/null || echo "N/A")
                LINE=$(jq -r ".Findings[$i].Line" full-history-report.json 2>/dev/null || echo "N/A")
                SECRET_TYPE=$(jq -r ".Findings[$i].Secret" full-history-report.json 2>/dev/null || echo "N/A")
                DESCRIPTION=$(jq -r ".Findings[$i].Description" full-history-report.json 2>/dev/null || echo "N/A")
                echo "| $COMMIT | $FILE | $LINE | $SECRET_TYPE | $DESCRIPTION |" >> full-history-summary.md
              done
            fi
            
            echo "" >> full-history-summary.md
            echo "---" >> full-history-summary.md
            echo "*This report was generated by the Full History Secrets Scan workflow.*" >> full-history-summary.md
          fi

      - name: Upload full history reports
        uses: actions/upload-artifact@v4
        with:
          name: full-history-secrets-scan-${{ github.sha }}
          path: |
            full-history-report.json
            full-history-report.txt
            full-history-summary.md
          retention-days: 30

      - name: Create GitHub issue with history findings
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('full-history-summary.md')) {
              console.log('No summary to post');
              return;
            }
            
            const summary = fs.readFileSync('full-history-summary.md', 'utf8');
            const findings = JSON.parse(fs.readFileSync('full-history-report.json', 'utf8') || '{}');
            const totalFindings = findings.Findings ? findings.Findings.length : 0;
            
            if (totalFindings === 0) {
              console.log('No historical findings to report');
              return;
            }
            
            // Check if there's already an open issue for secrets scan
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,secrets-scan'
            });
            
            if (issues.length > 0) {
              // Update existing issue
              const issue = issues[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## Full History Scan Results (${new Date().toISOString()})\n\n${summary}`
              });
              console.log(`Updated existing issue #${issue.number}`);
            } else {
              // Create new issue
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Historical Secrets Found: ${totalFindings} findings`,
                body: summary,
                labels: ['security', 'secrets-scan', 'priority:high']
              });
              console.log(`Created new issue #${newIssue.number}`);
            }
