name: Refresh visual baselines
# Manual review workflow: captures updated images on the Linux Chromium used by CI.
# It NEVER pushes to main. Candidate images go to a review branch `visual-baselines/<run id>`
# (and the artifact); a reviewer opens the images there and merges the branch only after looking.
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Test-name filter, e.g. "pnl|balance-sheet"'
        required: true
  push:
    branches: [arena/0ab26797-ledgerflow]
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - name: Generate candidate reference images
        env:
          SCREENS: ${{ inputs.screens || 'purchases|reconcile' }}
        run: npx playwright test e2e/visual-regression.spec.ts --grep "$SCREENS" --update-snapshots --retries=0
      - name: Check the entire reference set
        run: npx playwright test e2e/visual-regression.spec.ts --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-visual-baselines
          path: |
            e2e/__screenshots__/
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Push candidates to the current Arena branch only (temporary)
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "arena/0ab26797-ledgerflow" ]; then echo "Refusing unexpected branch $BRANCH"; exit 1; fi
          git add e2e/__screenshots__
          if git diff --cached --quiet; then echo "No image changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: candidate visual baselines (${{ inputs.screens }}) for review"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Updated current review branch: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
