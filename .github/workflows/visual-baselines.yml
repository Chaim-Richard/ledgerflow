name: Refresh visual baselines
# Manual review workflow: captures updated images on the Linux Chromium used by CI.
# It NEVER pushes to main; reviewers download the artifact and submit approved images via a PR.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      screens:
        description: 'Test-name filter, e.g. "pnl|balance-sheet"'
        required: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install --with-deps chromium
      - name: Generate candidate reference images
        env:
          SCREENS: ${{ inputs.screens }}
        run: npx playwright test e2e/visual-regression.spec.ts --grep "$SCREENS" --update-snapshots --retries=0
      - name: Check the entire reference set
        run: npx playwright test e2e/visual-regression.spec.ts --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-visual-baselines
          path: |
            e2e/__screenshots__/
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
